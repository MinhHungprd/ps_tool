<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập – Auto PSD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

  <!-- Mini toast style (nhẹ, không phụ thuộc lib nào) -->
</head>
<body>
  <section>
    <!-- leaves -->
    <div class="leaves">
      <div class="set">
        <div><img src="{{ url_for('static', filename='img/leaf_01.png') }}" alt=""></div>
        <div><img src="{{ url_for('static', filename='img/leaf_02.png') }}" alt=""></div>
        <div><img src="{{ url_for('static', filename='img/leaf_03.png') }}" alt=""></div>
        <div><img src="{{ url_for('static', filename='img/leaf_04.png') }}" alt=""></div>
        <div><img src="{{ url_for('static', filename='img/leaf_01.png') }}" alt=""></div>
        <div><img src="{{ url_for('static', filename='img/leaf_02.png') }}" alt=""></div>
        <div><img src="{{ url_for('static', filename='img/leaf_03.png') }}" alt=""></div>
        <div><img src="{{ url_for('static', filename='img/leaf_04.png') }}" alt=""></div>
      </div>
    </div>

    <!-- background layers -->
    <img src="{{ url_for('static', filename='img/bg.jpg') }}" class="bg" alt="">
    <img src="{{ url_for('static', filename='img/girl.png') }}" class="girl" alt="">
    <img src="{{ url_for('static', filename='img/trees.png') }}" class="trees" alt="">

    <!-- glass login -->
    <form class="login" method="POST">
      <h2>Sign In</h2>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for cat, msg in messages %}
            <div class="alert alert-{{cat}}">{{ msg }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <div class="inputBox">
        <input type="text" name="username" placeholder="Username" required>
      </div>
      <div class="inputBox">
        <input type="password" name="password" placeholder="Password" required>
      </div>
      <div class="inputBox">
        <input type="submit" value="Login" id="btn">
      </div>
      <div class="group">
        <a href="#" id="forgot-link" tabindex="-1">Forget Password</a>
        <a href="#" id="signup-link" tabindex="-1">Signup</a>
      </div>
    </form>
  </section>

  <!-- Mini toast container -->
  <div id="toast" class="mini-toast" role="status" aria-live="polite"></div>

  <script>
    // Hiển thị thông báo nổi 2.5 giây
    function showToast(message){
      const el = document.getElementById('toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(()=>el.classList.remove('show'), 2500);
    }

    // Signup: báo liên hệ admin
    document.getElementById('signup-link').addEventListener('click', function(e){
      e.preventDefault();
      showToast('Vui lòng liên hệ admin để được cấp tài khoản.');
    });

    // Forgot password: cũng báo liên hệ admin (nếu muốn)
    document.getElementById('forgot-link').addEventListener('click', function(e){
      e.preventDefault();
      showToast('Vui lòng liên hệ admin để đặt lại mật khẩu.');
    });
  </script>
</body>
</html>
