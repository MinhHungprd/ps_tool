{% extends "base.html" %}
{% set ambient = True %}
{% block title %}Xử lý đơn hàng tự động{% endblock %}

{% block content %}
<h1 class="mb-3 fw-bold">Xử lý đơn hàng tự động</h1>

<form id="order-form" method="POST" enctype="multipart/form-data" class="card p-3 p-md-4">
  <div class="mb-3">
    <label for="excel_file" class="form-label">Upload file Excel đơn hàng</label>
    <input type="file" class="form-control" id="excel_file" name="excel_file" required />
  </div>

  <div class="row g-3">
    <div class="col-sm-4">
      <label class="form-label" for="limit">Giới hạn số đơn xử lý</label>
      <input type="number" min="1" value="2" class="form-control" id="limit" name="limit" />
    </div>
    <div class="col-sm-4">
      <label class="form-label" for="sheet">Tên sheet (tùy chọn)</label>
      <input type="text" class="form-control" id="sheet" name="sheet" value="data" />
    </div>
    <div class="col-sm-4 d-flex align-items-end">
      <button type="submit" class="btn btn-primary w-100">Bắt đầu xử lý</button>
    </div>
  </div>
</form>

<div id="results" class="mt-4"></div>
{% endblock %}

{% block scripts %}
<script>
const form = document.getElementById("order-form");
const resultsEl = document.getElementById("results");

function renderItems(items) {
  if (!items?.length) return `<div class="alert alert-warning">Không có kết quả.</div>`;
  const rows = items.map((it, i) => `
    <tr>
      <td>${i + 1}</td>
      <td>${it.order_id ?? ""}</td>
      <td>${it.template ?? ""}</td>
      <td>${it.output_path ?? ""}</td>
      <td>${it.status ?? ""}</td>
      <td>${it.error ?? ""}</td>
    </tr>
  `).join("");
  return `
    <div class="card">
      <div class="card-body">
        <h5 class="card-title mb-3">Kết quả</h5>
        <div class="table-responsive">
          <table class="table table-striped align-middle">
            <thead>
              <tr>
                <th>#</th>
                <th>Mã đơn</th>
                <th>Template</th>
                <th>Output</th>
                <th>Trạng thái</th>
                <th>Lỗi</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  resultsEl.innerHTML = `<div class="alert alert-info">Đang xử lý...</div>`;
  const fd = new FormData(form);
  try {
    const res = await fetch(window.location.href, { method: "POST", body: fd });
    const ok = res.ok;
    let payload = null;
    try { payload = await res.json(); } catch { payload = null; }
    if (!ok) throw new Error("Request failed");
    const items = Array.isArray(payload) ? payload : (payload?.items || []);
    resultsEl.innerHTML = renderItems(items);
  } catch (err) {
    resultsEl.innerHTML = `<div class="alert alert-danger">Lỗi: ${err.message}</div>`;
  }
});
</script>
{% endblock %}
