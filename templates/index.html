<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Auto PSD Tool</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1>Xử Lý Đơn Hàng Tự Động</h1>
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="excel_file" class="form-label">Upload File Excel Đơn Hàng</label>
                <input type="file" class="form-control" id="excel_file" name="excel_file">
            </div>
            <button type="submit" class="btn btn-primary">Xử Lý</button>
        </form>
        <div id="results" class="mt-4"></div>
    </div>
    <script>
        document.querySelector('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const response = await fetch('/', { method: 'POST', body: formData });
            const data = await response.json();
            document.getElementById('results').innerHTML = '<h3>Kết Quả:</h3><ul>' + data.map(item => `<li>Order ${item.order_id}: <a href="${item.output_link}">Link Output</a></li>`).join('') + '</ul>';
        });
    </script>
</body>
</html>
