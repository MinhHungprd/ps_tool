{% extends "base.html" %}
{% set ambient = True %}
{% block title %}Xử lý đơn hàng tự động{% endblock %}

{% block content %}
<h1 class="mb-3 fw-bold">Xử lý đơn hàng tự động</h1>
{% if drive_connected %}
  <div class="alert alert-success d-flex align-items-center gap-2">
    <span class="me-2">✔️ Đã kết nối Google Drive</span>
    <a href="{{ url_for('main.disconnect_drive') }}" class="btn btn-sm btn-outline-success ms-auto">
      Ngắt kết nối
    </a>
  </div>
{% else %}
  <div class="mb-3">
    <a href="{{ url_for('main.connect_drive') }}" class="btn btn-success">
      <i class="bi bi-google"></i> Kết nối Google Drive
    </a>
  </div>
{% endif %}


<form id="order-form" method="POST" enctype="multipart/form-data" class="card p-3 p-md-4">
  <div class="mb-3">
    <label for="excel_file" class="form-label">Upload file Excel đơn hàng</label>
    <input type="file" class="form-control" id="excel_file" name="excel_file" required />
  </div>

  <div class="row g-3">
    <div class="col-sm-3">
      <label class="form-label" for="limit">Giới hạn số đơn xử lý</label>
      <input type="number" min="1" value="30" class="form-control" id="limit" name="limit" />
    </div>
    <div class="col-sm-3">
      <label class="form-label" for="sheet">Tên sheet (tùy chọn)</label>
      <input type="text" class="form-control" id="sheet" name="sheet" value="data" />
    </div>
    <div class="col-sm-3">
      <label class="form-label" for="batch">Số đơn mỗi lô (batch)</label>
      <input type="number" min="1" value="5" class="form-control" id="batch" name="batch" />
    </div>
    <div class="col-sm-3">
      <label class="form-label" for="report_every">Báo trạng thái mỗi n lô</label>
      <input type="number" min="1" value="2" class="form-control" id="report_every" name="report_every" />
    </div>
    <div class="col-sm-12 d-flex align-items-end">
      <button type="submit" class="btn btn-primary w-100">Bắt đầu xử lý</button>
    </div>
  </div>
</form>

<div id="results" class="mt-4"></div>

<script>
const form = document.getElementById("order-form");
const resultsEl = document.getElementById("results");

function ensureTable() {
  if (document.getElementById("result-body")) return;
  resultsEl.innerHTML = `
    <div class="card">
      <div class="card-body">
        <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
          <h5 class="card-title mb-0 me-2">Kết quả</h5>
          <span id="progress-badge" class="badge text-bg-info">0/0</span>
          <span id="batch-badge" class="badge text-bg-secondary">Batch: 0</span>
          <span id="elapsed-badge" class="badge text-bg-dark">Đã chạy: 00:00</span>
          <span id="eta-badge" class="badge text-bg-primary">Còn lại: --</span>
          <span id="finish-badge" class="badge text-bg-success">Dự kiến xong: --</span>
        </div>
        <div class="table-responsive">
          <table class="table table-striped align-middle">
            <thead>
              <tr>
                <th>#</th>
                <th>Mã đơn</th>
                <th>Template</th>
                <th>Output</th>
                <th>Trạng thái</th>
                <th>Lỗi</th>
              </tr>
            </thead>
            <tbody id="result-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

function fmtSec(sec) {
  if (sec == null || isNaN(sec)) return "--";
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  if (h > 0) return `${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function setProgress(done, total, batchCount, timing) {
  const pb = document.getElementById("progress-badge");
  const bb = document.getElementById("batch-badge");
  const eb = document.getElementById("elapsed-badge");
  const etb = document.getElementById("eta-badge");
  const fb = document.getElementById("finish-badge");
  if (pb) pb.textContent = `${done}/${total}`;
  if (bb) bb.textContent = `Batch: ${batchCount ?? 0}`;
  if (timing) {
    if (eb && typeof timing.elapsed_sec !== "undefined") {
      eb.textContent = `Đã chạy: ${fmtSec(timing.elapsed_sec)}`;
    }
    if (etb) {
      etb.textContent = `Còn lại: ${fmtSec(timing.eta_sec)}`;
    }
    if (fb) {
      fb.textContent = `Dự kiến xong: ${timing.finish_at ? new Date(timing.finish_at).toLocaleString() : "--"}`;
    }
  }
}

function appendRows(items) {
  const tbody = document.getElementById("result-body");
  if (!tbody) return;
  for (const it of items) {
    const idx = tbody.children.length + 1;
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${idx}</td>
      <td>${it.order_id ?? ""}</td>
      <td>${it.template ?? ""}</td>
      <td>${it.output_path ?? ""}</td>
      <td>${it.status ?? ""}</td>
      <td>${it.error ?? ""}</td>
    `;
    tbody.appendChild(tr);
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  resultsEl.innerHTML = `<div class="alert alert-info">Đang xử lý…</div>`;
  ensureTable();
  setProgress(0, 0, 0);

  const fd = new FormData(form);
  try {
    const res = await fetch(window.location.href, { method: "POST", body: fd });
    if (!res.ok || !res.body) throw new Error("Request failed");

    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buf = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      const lines = buf.split("\n");
      buf = lines.pop() || "";

      for (const line of lines) {
        if (!line.trim()) continue;
        let msg = null;
        try { msg = JSON.parse(line); } catch { continue; }

        if (msg.type === "start") {
          setProgress(0, msg.total ?? 0, 0, msg.timing || null);
        } else if (msg.type === "progress") {
          const last = Array.isArray(msg.last_batches) ? msg.last_batches : [];
          appendRows(last);
          setProgress(msg.done ?? 0, msg.total ?? 0, msg.batch_count ?? 0, msg.timing || null);
        } else if (msg.type === "upload_error") {
          console.warn("Upload error:", msg.message);
        } else if (msg.type === "error") {
          resultsEl.insertAdjacentHTML("afterbegin",
            `<div class="alert alert-danger">Lỗi: ${msg.message}</div>`);
        } else if (msg.type === "done") {
          setProgress(
            (msg.items || []).length, (msg.items || []).length,
            undefined,
            msg.timing || null
          );
        } else if (msg.type === "tmp_cleanup") {
          console.log("Đã xóa ảnh tạm:", msg.removed);
        }
      }
    }
  } catch (err) {
    resultsEl.innerHTML = `<div class="alert alert-danger">Lỗi: ${err.message}</div>`;
  }
});
</script>
{% endblock %}
